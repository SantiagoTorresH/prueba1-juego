<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Shockers  - Menú Principal</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body class="menu-page">
    <div class="container">
        <div class="user-bar">
            <div class="user-info">
                <span id="userLabel">Cargando usuario...</span>
                <span id="sessionStatus" class="status-chip">Conectado</span>
            </div>
            <button class="logout-button" onclick="logout()">Cerrar sesión</button>
        </div>
        <h1>Alien Shockers </h1>
        
        <div class="room-selector">
            <label for="roomIdInput">Sala:</label>
            <input id="roomIdInput" class="room-input" placeholder="default-room" value="default-room" />
            <button class="room-button" onclick="startGame()">Entrar a sala</button>
        </div>
        <div id="roomHint" class="room-hint">Puedes usar cualquier nombre para crear o unirte a una sala.</div>

        <div class="preview-section">
            <div id="preview-container"></div>
            
            <div class="weapons">
                <div class="weapon selected" data-weapon="pistol" onclick="selectWeapon('pistol')">
                    <div class="weapon-icon weapon-icon-pistol" aria-hidden="true"></div>
                    <div class="weapon-info">
                        <h3>Pistola</h3>
                        <div class="weapon-stats">
                            <p>Daño: 10</p>
                            <p>Velocidad: 0.5</p>
                        </div>
                    </div>
                </div>
                
                <div class="weapon" data-weapon="shotgun" onclick="selectWeapon('shotgun')">
                    <div class="weapon-icon weapon-icon-shotgun" aria-hidden="true"></div>
                    <div class="weapon-info">
                        <h3>Escopeta</h3>
                        <div class="weapon-stats">
                            <p>Daño: 15</p>
                            <p>Velocidad: 0.3</p>
                        </div>
                    </div>
                </div>
                
                <div class="weapon" data-weapon="rifle" onclick="selectWeapon('rifle')">
                    <div class="weapon-icon weapon-icon-rifle" aria-hidden="true"></div>
                    <div class="weapon-info">
                        <h3>Rifle</h3>
                        <div class="weapon-stats">
                            <p>Daño: 20</p>
                            <p>Velocidad: 0.7</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button class="play-button" onclick="startGame()">¡Jugar!</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/session.js"></script>
    <script src="menu-preview.js"></script>
    <script>
        let selectedWeapon = 'pistol';

        function selectWeapon(weaponType) {
            // Remover selección anterior
            document.querySelector('.weapon.selected').classList.remove('selected');
            // Agregar selección nueva
            document.querySelector(`[data-weapon="${weaponType}"]`).classList.add('selected');
            // Guardar arma seleccionada
            selectedWeapon = weaponType;
            // Actualizar vista previa
            updateWeapon(weaponType);
        }

        async function startGame() {
            const roomId = document.getElementById('roomIdInput').value.trim() || 'default-room';
            const user = window.authSession.getStoredUser();

            if (!user) {
                logout();
                return;
            }

            localStorage.setItem('selectedWeapon', selectedWeapon);
            localStorage.setItem('roomId', roomId);

            try {
                    const response = await fetch('/api/rooms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roomId })
                });

                if (!response.ok) {
                    throw new Error('Error creando o entrando a la sala');
                }

                window.location.replace('/game.html');
            } catch (error) {
                document.getElementById('roomHint').textContent = error.message;
            }
        }

        function logout() {
            window.authSession.clearAuthState();
            localStorage.removeItem('roomId');
            localStorage.removeItem('selectedWeapon');
            window.authSession.updateSessionStatus(document.getElementById('sessionStatus'));
            window.location.replace('/auth.html');
        }

        async function loadUser() {
            const user = await window.authSession.validateStoredSession({ redirectTo: '/auth.html' });
            if (!user) {
                return;
            }

            document.getElementById('userLabel').textContent = `Usuario: ${user.username}`;
            window.authSession.updateSessionStatus(document.getElementById('sessionStatus'));
        }

        window.addEventListener('online', () => window.authSession.updateSessionStatus(document.getElementById('sessionStatus')));
        window.addEventListener('offline', () => window.authSession.updateSessionStatus(document.getElementById('sessionStatus')));
        loadUser();
    </script>
</body>
</html>
