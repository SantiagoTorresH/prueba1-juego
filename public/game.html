<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shell Shockers Clone - Juego</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        
        #menuButton {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 215, 0, 0.8);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            z-index: 1000;
        }
        
        #menuButton:hover {
            background: rgba(255, 215, 0, 1);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <button id="menuButton" onclick="returnToMenu()">Volver al Menú</button>
    
    <!-- Cargar scripts en el orden correcto -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
    
    <script>
        function returnToMenu() {
            // Limpiar localStorage si es necesario
            // localStorage.removeItem('selectedWeapon');
            
            // Redirigir al menú principal
            window.location.href = 'http://localhost:3000/menu.html';
        }
    </script>
</body>
</html>
